site_name: Ctrl Case
site_description: A printed split housing for the ESP32 Cheap Yellow Display (USB-C), shared by every WOODWERD CYD build.
site_url: https://WOODWERD.github.io/cyd-case/
repo_url: https://github.com/WOODWERD/cyd-case
repo_name: cyd-case
edit_uri: edit/main/docs/
copyright: "© 2026 WOODWERD LLC · MIT"
docs_dir: docs
theme:
  name: material
  custom_dir: docs-theme/overrides   # WOODWERD/ctrl-docs-theme, checked out at build time
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle: { icon: material/monitor, name: "Theme: match my computer's setting" }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: "Theme: light" }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: "Theme: dark" }
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.suggest
  font:
    text: Inter
    code: JetBrains Mono
extra_css:
  - assets/woodwerd/woodwerd.css
extra:
  purpose: 'Printed housings and parts lists for the 2.8" and 3.5" boards.'
  version: Housing v3
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/WOODWERD
      name: WOODWERD on GitHub
    - icon: material/web
      link: https://woodwerd.com
      name: woodwerd.com
nav:
  - Home: index.md
  - Build guide: BUILD.md
  - Housing v3: housing-v3.md
  - Housing v2: housing-v2.md
  - Changelog: changelog.md
  - Notices & license: notices.md
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
plugins:
  - search
